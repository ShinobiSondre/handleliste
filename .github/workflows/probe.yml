name: Probe APIs
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: tjek params
        run: |
          set +e
          for p in "r_radius=25000&limit=5" "r_radius=15000&limit=5" "r_radius=25000&limit=40" "r_radius=25000&limit=24" "r_radius=15000&limit=24&offset=0" "r_radius=5000&limit=24"; do
            r=$(curl -sS -m 20 "https://squid-api.tjek.com/v2/offers/search?r_lat=59.744&r_lng=10.204&$p&r_locale=nb_NO&api_av=0.3.0&query=melk" -w " HTTP%{http_code}")
            echo "::notice title=$p::$(echo "${r% HTTP*}" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(len(d), "keys:", sorted(d[0].keys()) if d else "", "|", [((o.get("branding") or {}).get("name"),(o.get("dealer") or {}).get("name"),o["heading"]) for o in d[:6]])' 2>&1 | head -c 1200) ${r##* }"
          done
      - name: overpass
        run: |
          set +e
          q='[out:json][timeout:25];nwr(around:600,59.7440,10.2045)["shop"~"^(supermarket|convenience|grocery)$"];out center tags;'
          for s in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter; do
            o=$(curl -sS -m 40 -A "Handleliste/1.0 (Android; github.com/ShinobiSondre/handleliste)" -H "Accept: application/json" --data-urlencode "data=$q" "$s" -w " HTTP%{http_code}")
            echo "::notice title=$s::$(echo "${o% HTTP*}" | python3 -c 'import json,sys;d=json.load(sys.stdin)["elements"];print(len(d),[(e["type"],e.get("tags",{}).get("name")) for e in d][:12])' 2>&1 | tail -c 400) ${o##* }"
          done
