name: Probe APIs
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: meny
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) Handleliste/1.0"
          r=$(curl -sS -m 20 -A "$UA" "https://platform-rest-prod.ngdata.no/api/episearch/1300/products?search=jacobs%20pesto&page_size=5")
          echo "::notice title=hit::$(echo "$r" | python3 -c 'import json,sys;h=json.load(sys.stdin)["hits"][0];cd=h["contentData"];print({k:h[k] for k in h if k!="contentData"}, {k:cd[k] for k in ("price","pricePerUnit","pricePerUnitOriginal","comparePricePerUnit","isOffer","promotions","imagePath","brand","title","subtitle","description") if k in cd}, sorted(cd.keys()))' 2>&1 | head -c 2500)"
          r=$(curl -sS -m 20 -A "$UA" "https://platform-rest-prod.ngdata.no/api/episearch/1300/products?search=kyllingfilet&page_size=10")
          echo "::notice title=kylling::$(echo "$r" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d["total"],[(h["title"],h["description"],h["contentData"].get("pricePerUnit")) for h in d["hits"]])' 2>&1 | head -c 1500)"
          for u in "https://bilder.ngdata.no/7035620025204/meny/medium.jpg" "https://bilder.ngdata.no/7035620025204/meny/large.jpg" "https://bilder.ngdata.no/7035620025204/meny/small.jpg"; do
            echo "::notice title=img::$u $(curl -sS -o /dev/null -m 20 -w '%{http_code} %{content_type} %{size_download}' "$u")"
          done
