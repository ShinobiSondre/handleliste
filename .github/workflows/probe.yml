name: Probe APIs
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: oda
        run: |
          r=$(curl -sS -m 20 -A "Handleliste/1.0 (Android; github.com/ShinobiSondre/handleliste)" "https://oda.com/api/v1/search/?q=kyllingfilet")
          echo "::notice title=oda keys::$(echo "$r" | python3 -c 'import json,sys;d=json.load(sys.stdin);p=d["products"];print(len(p),"top:",list(d.keys()),"prod keys:",sorted(p[0].keys()),"images:",json.dumps(p[0].get("images"))[:500])' 2>&1 | head -c 1800)"
          echo "::notice title=oda names::$(echo "$r" | python3 -c 'import json,sys;d=json.load(sys.stdin);print([(x["full_name"],x.get("name_extra"),x.get("gross_price"),(x.get("discount") or {}) and "disc") for x in d["products"]][:20])' 2>&1 | head -c 1800)"
