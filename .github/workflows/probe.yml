name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Handleliste/1.0 (Android; github.com/ShinobiSondre/handleliste)"
          curl -s -A "$UA" "https://world.openfoodfacts.org/cgi/search.pl?search_terms=grandiosa&countries_tags_en=norway&json=1&page_size=3&fields=code,product_name,brands" | head -c 800; echo
          for E in 7020650021142 7038010009457 7311041013656; do
            echo "== OFF $E"; curl -s -A "$UA" "https://world.openfoodfacts.org/api/v2/product/$E.json?fields=product_name,brands,quantity,image_front_small_url" | head -c 400; echo
            echo "== NG $E"; curl -s -A "$UA" "https://platform-rest-prod.ngdata.no/api/episearch/1300/products?search=$E&page_size=3" | head -c 600; echo
            echo "== ODA $E"; curl -s -A "$UA" "https://oda.com/api/v1/search/?q=$E" | head -c 400; echo
          done
