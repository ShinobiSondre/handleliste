name: Probe APIs
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: pictures
        run: |
          set +e
          UA="Handleliste/1.0 (Android; github.com/ShinobiSondre/handleliste)"
          r=$(curl -sS -m 20 -A "$UA" "https://oda.com/api/v1/search/mixed/?q=taco&type=recipe")
          u=$(echo "$r" | python3 -c 'import json,sys;d=json.load(sys.stdin);a=[i["attributes"] for i in d["items"] if i.get("type")=="recipe"][0];print(sorted(k for k in a if "im" in k), file=sys.stderr);print(a.get("feature_image_url") or a.get("image_url") or a.get("image"))')
          echo "::notice title=oda keys and url::$u"
          echo "::notice title=oda as-is::$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$u")"
          m=$(echo "$u" | sed 's/width=1000/width=600/')
          echo "::notice title=oda width changed::$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$m")"
          c=$(curl -sS -m 20 -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=6&gsrsearch=filetype:bitmap%20tex%20mex%20taco%20food&prop=imageinfo&iiprop=url|mime&iiurlwidth=600")
          t=$(echo "$c" | python3 -c 'import json,sys;d=json.load(sys.stdin);p=d["query"]["pages"];print(sorted(p.values(),key=lambda x:x.get("index",99))[0]["imageinfo"][0]["thumburl"])' 2>&1)
          echo "::notice title=commons thumb::$t"
          echo "::notice title=commons fetch okhttp UA::$(curl -sS -o /dev/null -A 'okhttp/4.12.0' -w '%{http_code}' "$t")"
          echo "::notice title=commons fetch app UA::$(curl -sS -o /dev/null -A "$UA" -w '%{http_code}' "$t")"
