name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md", ".github/workflows/probe.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build release APK
        run: |
          set +e
          gradle :app:testReleaseUnitTest :app:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Show the errors as annotations so they can be read without the full log.
            grep -E "^e: |What went wrong|Could not (resolve|find)|> .*(error|failed)|FAILED|AssertionError|expected:" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      # Not needed for the build: shows (in the run summary) that the free data sources answer as expected.
      - name: Check the free APIs
        continue-on-error: true
        run: |
          c=$(curl -sS -m 20 "https://squid-api.tjek.com/v2/catalogs?r_lat=59.744&r_lng=10.204&r_radius=30000&r_locale=nb_NO&api_av=0.3.0&limit=100&types=paged,incito")
          echo "::notice title=Flyers near Drammen::$(echo "$c" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(len(d),"catalogs:",[((x.get("branding") or {}).get("name"),x.get("offer_count")) for x in d][:30])' 2>&1 | head -c 1200)"
          id=$(echo "$c" | python3 -c 'import json,sys;print(next(x["id"] for x in json.load(sys.stdin) if (x.get("branding") or {}).get("name")=="KIWI"))' 2>/dev/null)
          o=$(curl -sS -m 20 "https://squid-api.tjek.com/v2/offers?catalog_ids=$id&limit=100&offset=0&api_av=0.3.0")
          echo "::notice title=KIWI flyer::$(echo "$o" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(len(d),"offers:",[(x["heading"],x["pricing"]["price"],x["pricing"].get("pre_price")) for x in d][:15])' 2>&1 | head -c 1200)"
          q='[out:json][timeout:25];nwr(around:600,59.7440,10.2045)["shop"~"^(supermarket|convenience|grocery)$"];out center tags;'
          m=$(curl -sS -m 40 -A "Handleliste/1.0 (Android; github.com/ShinobiSondre/handleliste)" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter)
          echo "::notice title=Stores in Drammen sentrum (OpenStreetMap)::$(echo "$m" | python3 -c 'import json,sys;d=json.load(sys.stdin)["elements"];print(len(d),[e.get("tags",{}).get("name") for e in d])' 2>&1 | tail -c 600)"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Handleliste-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Handleliste-apk
          path: Handleliste-*.apk

      # The app checks this release on start and installs it by itself.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Handleliste v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || 'Built by hand from the Actions tab.' }}
          files: Handleliste-*.apk
          make_latest: true
